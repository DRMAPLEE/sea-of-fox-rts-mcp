name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check package version matches the tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - name: Pack release
        id: pack
        run: |
          filename=$(npm pack --silent)
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - name: Publish package
        env:
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: npm publish "./$TARBALL"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: gh release create "$GITHUB_REF_NAME" "$TARBALL" --verify-tag --generate-notes
