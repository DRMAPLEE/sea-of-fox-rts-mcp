name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check package version matches the tag
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - name: Pack release
        id: pack
        run: |
          filename=$(npm pack --silent)
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - name: Publish package
        env:
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: |
          package=$(node -p "const p=require('./package.json'); p.name+'@'+p.version")
          if published=$(npm view "$package" dist.integrity 2>registry-error.log); then
            if [ -n "$published" ]; then
              packed=$(node -p "'sha512-'+require('node:crypto').createHash('sha512').update(require('node:fs').readFileSync(process.env.TARBALL)).digest('base64')")
              if [ "$published" != "$packed" ]; then
                echo "The registry already contains a different tarball for $package" >&2
                exit 1
              fi
              exit 0
            fi
          elif ! grep -q 'E404' registry-error.log; then
            cat registry-error.log >&2
            exit 1
          fi
          npm publish "./$TARBALL"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.filename }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "$TARBALL" --verify-tag --generate-notes
          fi
